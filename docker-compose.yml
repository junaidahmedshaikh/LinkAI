version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: linkai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: linkai

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: linkai-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - apps/server/.env
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/linkai

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: linkai-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
